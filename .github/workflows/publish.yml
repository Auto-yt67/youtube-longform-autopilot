name: Publish Car Professor Video

on:
  schedule:
    # Fire once a day at 18:00 UTC. GitHub often runs scheduled jobs LATE
    # (sometimes by hours) and ignores daylight saving, so we do NOT rely on the
    # exact minute. The guard below accepts a wide New York-time window and a
    # once-per-day lock, so a late GitHub run still publishes exactly one video.
    - cron: "0 18 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the once-per-day marker file

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Decide whether to run (delay-tolerant, once per day)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run - always proceeds."
            exit 0
          fi
          HOUR=$(TZ=America/New_York date +%H)
          TODAY=$(TZ=America/New_York date +%F)
          LAST=$(cat .last_publish 2>/dev/null || echo "never")
          # Wide window (1pm-8pm NY) so a late GitHub cron still counts as today's
          # run; the date check stops a second publish on the same day.
          if [ "$HOUR" -ge 13 ] && [ "$HOUR" -le 20 ] && [ "$TODAY" != "$LAST" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Publishing today's video (NY hour ${HOUR}, last publish: ${LAST})."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping (NY hour ${HOUR}, today ${TODAY}, last publish ${LAST})."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Download Piper voice model
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.local/share/piper-voices"
          python -m piper.download_voices --download-dir "$HOME/.local/share/piper-voices" en_US-bryce-medium
          ls -la "$HOME/.local/share/piper-voices"

      - name: Cache rembg model
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2netp-model-v1

      - name: Pre-fetch lightweight rembg model (u2netp)
        if: steps.gate.outputs.run == 'true'
        run: |
          # Force the small u2netp model (~4MB). The rembg default (bria-rmbg,
          # ~1GB) OOM-kills the runner. This warms the ~/.u2net cache.
          python -c "from rembg import new_session; new_session('u2netp')"
          ls -la ~/.u2net || true

      - name: Download display font
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p src/assets/fonts
          curl -sL -o src/assets/fonts/LuckiestGuy-Regular.ttf \
            https://github.com/google/fonts/raw/main/apache/luckiestguy/LuckiestGuy-Regular.ttf
          ls -la src/assets/fonts

      - name: Run pipeline
        if: steps.gate.outputs.run == 'true'
        working-directory: src
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
        run: python -u pipeline.py

      - name: Record today's publish (once-per-day lock)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          TZ=America/New_York date +%F > .last_publish
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_publish
          git commit -m "Record daily publish [skip ci]" || echo "nothing to commit"
          git push || echo "push failed (non-fatal)"

      - name: Upload run artifacts (for debugging failed runs)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: src/run_output/**/script.json
          retention-days: 14
