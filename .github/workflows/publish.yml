name: Publish Car Professor Video

on:
  schedule:
    # Runs Mon/Wed/Fri at 3pm UTC. Adjust to taste - cron is UTC always.
    - cron: "0 15 * * 1,3,5"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download Piper voice model
        run: python -m piper.download_voices en_US-lessac-medium

      - name: Run pipeline
        working-directory: src
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
        run: python pipeline.py

      - name: Upload run artifacts (for debugging failed runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: src/run_output/**/script.json
          retention-days: 14
